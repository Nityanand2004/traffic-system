<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Traffic System</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">🚦 Traffic Violation System</h2>

    <!-- FORM -->
    <div class="card p-3 mb-4">
        <h5>Add Violation</h5>

        <form id="form">
            <div class="row">
                <div class="col">
                    <input class="form-control" placeholder="Vehicle ID" id="vehicleId">
                </div>
                <div class="col">
                    <input class="form-control" placeholder="Speed" id="speed">
                </div>
                <div class="col">
                    <input class="form-control" placeholder="Zone" id="zone">
                </div>
                <div class="col">
                    <input class="form-control" placeholder="Fine" id="fine">
                </div>
                <div class="col">
                    <button class="btn btn-primary">Add</button>
                </div>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="card p-3">
        <h5>All Violations</h5>

        <table class="table table-bordered mt-3">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Vehicle</th>
                <th>Speed</th>
                <th>Zone</th>
                <th>Fine</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>

    // ADD DATA
    document.getElementById("form").addEventListener("submit", function(e) {
        e.preventDefault();

        fetch("http://localhost:9091/violations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                vehicleId: vehicleId.value,
                speed: speed.value,
                zone: zone.value,
                fine: fine.value
            })
        }).then(() => loadData());
    });

    // LOAD DATA
    function loadData() {
        fetch("http://localhost:9091/violations")
            .then(res => res.json())
            .then(data => {

                let table = document.getElementById("tableBody");
                table.innerHTML = "";

                data.forEach(v => {
                    let row = `
                <tr>
                    <td>${v.id}</td>
                    <td>${v.vehicleId}</td>
                    <td>${v.speed}</td>
                    <td>${v.zone}</td>
                    <td>₹${v.fine}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteData(${v.id})">Delete</button>
                    </td>
                </tr>
            `;
                    table.innerHTML += row;
                });
            });
    }

    // DELETE
    function deleteData(id) {
        fetch("http://localhost:9091/violations/" + id, {
            method: "DELETE"
        }).then(() => loadData());
    }

    loadData();

</script>

</body>
</html>
